{% extends "base.html" %}
{% block title %}Page Not Found – JobNest{% endblock %}
{% block content %}
<div class="container text-center" style="padding: 6rem 1.5rem;">
  <div style="max-width: 520px; margin: 0 auto;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
    <h2 style="margin: 1.25rem 0 0.75rem;">Page Not Found</h2>
    <p class="text-muted" style="margin-bottom: 2rem;">The page or resource you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
    <div class="flex justify-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
      <a href="{{ url_for('jobs.index') }}" class="btn btn-outline">Explore Jobs</a>
    </div>
  </div>
</div>
{% endblock %}
