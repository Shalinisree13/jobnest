{% extends "base.html" %}
{% block title %}Internal Server Error – JobNest{% endblock %}
{% block content %}
<div class="container text-center" style="padding: 6rem 1.5rem;">
  <div style="max-width: 520px; margin: 0 auto;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--warning); line-height: 1;">500</div>
    <h2 style="margin: 1.25rem 0 0.75rem;">Internal Server Error</h2>
    <p class="text-muted" style="margin-bottom: 2rem;">Something unexpected happened on our end while processing your request. Our engineering team has been notified.</p>
    <div class="flex justify-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
